name: Continuous Integration and Delivery with Github Actions

on:
  push:
    branches: [ "main" ]
    # Mudanças só em documentação não disparam build nem deploy
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main" ]

# A esteira só lê o repositório (menor privilégio)
permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
        cache: maven

    - name: Build and test with Maven
      working-directory: apicrud-alunos
      run: mvn -B verify

    - name: Docker Compose Build
      working-directory: apicrud-alunos
      run: docker compose build

    # Docker Hub (opcional): para ativar, cadastre os secrets DOCKER_USERNAME e DOCKER_ACCESS_TOKEN
    # e remova o "#" das linhas abaixo. Publica só em push na main (PRs não têm acesso aos secrets).
    # - name: Login to Docker Hub
    #   if: github.event_name == 'push'
    #   uses: docker/login-action@v4
    #   with:
    #     username: ${{ secrets.DOCKER_USERNAME }}
    #     password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
    #
    # - name: Push to Docker Hub
    #   if: github.event_name == 'push'
    #   run: |
    #     docker tag vitrodr/crud-alunos:latest vitrodr/crud-alunos:${{ github.sha }}
    #     docker push vitrodr/crud-alunos:latest
    #     docker push vitrodr/crud-alunos:${{ github.sha }}

    # Deploy na AWS: imagem no ECR e nova revisão da task no ECS (também só em push na main)
    - name: Configure AWS credentials
      if: github.event_name == 'push'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      if: github.event_name == 'push'
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@v2

    - name: Push to Amazon ECR
      if: github.event_name == 'push'
      run: |
        ECR_IMAGE=${{ steps.ecr-login.outputs.registry }}/respositorio-crud-alunos
        docker tag vitrodr/crud-alunos:latest $ECR_IMAGE:${{ github.sha }}
        docker tag vitrodr/crud-alunos:latest $ECR_IMAGE:latest
        docker push $ECR_IMAGE:${{ github.sha }}
        docker push $ECR_IMAGE:latest

    - name: Render ECS task definition
      if: github.event_name == 'push'
      id: render-task
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: apicrud-alunos/task-definition.json
        container-name: container-crudalunos
        image: ${{ steps.ecr-login.outputs.registry }}/respositorio-crud-alunos:${{ github.sha }}

    - name: Deploy to Amazon ECS
      if: github.event_name == 'push'
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.render-task.outputs.task-definition }}
        service: service-crud-alunos
        cluster: cluster-crud-alunos
        wait-for-service-stability: true
