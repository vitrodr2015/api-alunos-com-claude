spring:
  application:
    name: apicrud-alunos
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Padrão seguro: o MySQL local do Docker (porta 3307). Na nuvem, DB_URL vem da Task Definition.
    url: ${DB_URL:jdbc:mysql://localhost:3307/crud_alunos?createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    # Segredo sem valor padrão: sem DB_PASSWORD a aplicação não sobe
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # validate: o Hibernate só confere o banco criado pelo Flyway, nunca o altera
      ddl-auto: validate
  data:
    web:
      pageable:
        # sem page/size na URL: página 0 com 20 itens; size acima de 50 é reduzido para 50
        default-page-size: 20
        max-page-size: 50

security:
  jwt:
    # Segredo sem valor padrão: sem JWT_SECRET a aplicação não sobe. Precisa de pelo menos 32 caracteres aleatórios (HS256).
    secret: ${JWT_SECRET}
    issuer: apicrud-alunos
    # access token curto; refresh token mais longo (sem lista de revogação, um token vale até expirar)
    access-token-expiration: 15m
    refresh-token-expiration: 24h
