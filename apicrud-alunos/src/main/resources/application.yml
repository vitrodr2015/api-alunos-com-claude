spring:
  application:
    name: apicrud-alunos
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Padrão seguro: o MySQL local do Docker (porta 3307). Na nuvem, DB_URL vem da Task Definition.
    url: ${DB_URL:jdbc:mysql://localhost:3307/crud_alunos?createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    # Segredo sem valor padrão: sem DB_PASSWORD a aplicação não sobe
    password: ${DB_PASSWORD}
    hikari:
      # Tempo máximo esperando uma conexão do banco. O padrão (30 s) deixava a API pendurada meio minuto com o banco
      # fora do ar; com 5 s ela responde 503 logo, e o /actuator/health completo também.
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # validate: o Hibernate só confere o banco criado pelo Flyway, nunca o altera
      ddl-auto: validate
  data:
    web:
      pageable:
        # sem page/size na URL: página 0 com 20 itens; size acima de 50 é reduzido para 50
        default-page-size: 20
        max-page-size: 50

security:
  jwt:
    # Segredo sem valor padrão: sem JWT_SECRET a aplicação não sobe. Precisa de pelo menos 32 caracteres aleatórios (HS256).
    secret: ${JWT_SECRET}
    issuer: apicrud-alunos
    # access token curto; refresh token mais longo (sem lista de revogação, um token vale até expirar)
    access-token-expiration: 15m
    refresh-token-expiration: 24h

cors:
  # Origens (domínios) que podem chamar a API pelo navegador, separadas por vírgula. Vazio = nenhuma (sem CORS).
  # Nunca use '*': a aplicação não sobe. Exemplo: CORS_ALLOWED_ORIGINS=https://app.exemplo.com,http://localhost:5173
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

app:
  admin-bootstrap:
    # Criação CONTROLADA do primeiro administrador, numa execução única: defina ADMIN_BOOTSTRAP_PASSWORD (mínimo 12
    # caracteres), suba a aplicação uma vez e REMOVA a variável. Vazio (o padrão) = desligado. Só cria se ainda não
    # existir nenhum ADMIN. Na AWS a senha vem do Secrets Manager, nunca escrita em arquivo.
    username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

# Swagger / OpenAPI. DESLIGADO por padrao (a documentacao nao fica exposta sem querer, principalmente em producao).
# Para ver a tela: SWAGGER_ENABLED=true e abrir /swagger-ui/index.html. Ligado, as rotas da documentacao sao publicas
# (a tela precisa carregar antes do login); chamar a API continua exigindo o token (botao Authorize).
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    # guarda o token ao recarregar a pagina
    persist-authorization: true
    operations-sorter: method
    tags-sorter: alpha

# Health check (Actuator). Expoe SOMENTE o health: env, beans, heapdump, mappings, metrics etc. nao existem na web.
# GET /actuator/health devolve so {"status":"UP"} (sem detalhes). Com probes.enabled ha tambem:
#   /actuator/health/liveness  = "o processo esta vivo" (NAO depende do banco; use este em orquestrador/ALB)
#   /actuator/health/readiness = "pronta para receber trafego"
# O /actuator/health completo inclui o banco: com o RDS parado ele responde 503 DOWN.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
