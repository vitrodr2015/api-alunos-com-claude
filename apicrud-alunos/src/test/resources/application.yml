spring:
  application:
    name: apicrud-alunos
  # Os testes usam H2 e as migrations são específicas do MySQL
  flyway:
    enabled: false
  jpa:
    # o data.sql só pode rodar depois de o Hibernate criar a tabela (ddl-auto: create-drop)
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
