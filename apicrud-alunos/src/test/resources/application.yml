spring:
  application:
    name: apicrud-alunos
  # Os testes usam H2 e as migrations são específicas do MySQL
  flyway:
    enabled: false
  jpa:
    # o data.sql só pode rodar depois de o Hibernate criar a tabela (ddl-auto: create-drop)
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  sql:
    init:
      # roda o data.sql sempre (para banco embutido já é o padrão; explícito para não depender disso)
      mode: always
  # o arquivo de teste substitui o principal, então os limites de paginação precisam estar aqui também
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

# Valores só para os testes. O segredo abaixo é FALSO de propósito (não protege nada e não é o de nenhum ambiente);
# o arquivo de teste substitui o principal, então a configuração do JWT precisa estar aqui também.
security:
  jwt:
    secret: TESTE-nao-e-um-segredo-real-0123456789abcdef
    issuer: apicrud-alunos
    access-token-expiration: 15m
    refresh-token-expiration: 24h

# Origens de CORS só para os testes (duas, para provar a lista e o espaço depois da vírgula)
cors:
  allowed-origins: https://app.exemplo.com, http://localhost:3000

# Mesma configuracao de Actuator do application.yml principal (o de teste o substitui); o ConfigHygieneTests confere o principal
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
